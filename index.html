<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KS Watches — Timeless Luxury</title>
  <meta name="description" content="KS Watches — premium timepieces curated by Karshil Shah." />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --navy:#071a35; --navy2:#0b2850; --blue:#8ed8f5; --ice:#eaf9ff;
      --white:#fff; --text:#10233d; --muted:#6c7b8e; --line:#dbeaf3;
      --shadow:0 24px 60px rgba(7,26,53,.13); --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:#f8fcff}
    button,input,select{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    .topbar{background:var(--navy);color:#dff7ff;text-align:center;padding:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(219,234,243,.85)}
    .nav{max-width:1240px;margin:auto;height:76px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .logo{font-family:Georgia,serif;font-size:28px;font-weight:700;letter-spacing:.08em;color:var(--navy)}
    .logo span{color:#4baed1}
    .navlinks{display:flex;gap:28px;font-size:14px;font-weight:600;color:#38516d}
    .navlinks a:hover{color:#1685b4}
    .actions{display:flex;gap:10px;align-items:center}
    .iconbtn{width:42px;height:42px;border:1px solid var(--line);background:white;border-radius:50%;color:var(--navy);position:relative}
    .badge{position:absolute;right:-3px;top:-3px;background:var(--navy);color:white;width:18px;height:18px;border-radius:50%;font-size:10px;display:grid;place-items:center}
    .hero{min-height:680px;background:radial-gradient(circle at 80% 35%,#c9f2ff 0,#b7e9fa 18%,transparent 42%),linear-gradient(135deg,#fff 0,#eefaff 52%,#d9f4ff 100%);display:grid;place-items:center;overflow:hidden}
    .heroInner{max-width:1240px;width:100%;padding:80px 24px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px}
    .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:800;color:#1685b4}
    h1{font-family:Georgia,serif;font-size:clamp(54px,7vw,92px);line-height:.93;margin:18px 0;color:var(--navy);font-weight:500}
    .hero p{font-size:18px;line-height:1.75;color:#50657d;max-width:560px}
    .cta{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:15px 24px;border-radius:999px;border:1px solid var(--navy);background:var(--navy);color:white;font-weight:700;box-shadow:0 14px 30px rgba(7,26,53,.2)}
    .cta:hover{transform:translateY(-2px)}
    .heroWatch{width:min(480px,90vw);aspect-ratio:1;position:relative;margin:auto;filter:drop-shadow(0 30px 35px rgba(7,26,53,.25))}
    .strap{position:absolute;width:26%;height:100%;left:37%;background:linear-gradient(90deg,#091b36,#234b76,#091b36);border-radius:40px}
    .watchFace{position:absolute;width:68%;aspect-ratio:1;left:16%;top:16%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#dff9ff,#8fdaf5 30%,#153d6a 67%,#071a35 69%);border:16px solid #dcecf4;box-shadow:inset 0 0 0 5px #7695ac,0 0 0 10px rgba(7,26,53,.08)}
    .watchFace:before{content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid rgba(255,255,255,.55)}
    .hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom;background:white;border-radius:5px}
    .h1{width:4px;height:28%;transform:rotate(40deg)}
    .h2{width:3px;height:36%;transform:rotate(142deg)}
    .centerDot{position:absolute;width:12px;height:12px;border-radius:50%;background:#8ed8f5;left:calc(50% - 6px);top:calc(50% - 6px)}
    section{max-width:1240px;margin:auto;padding:90px 24px}
    .sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:34px}
    .sectionHead h2{font-family:Georgia,serif;font-size:46px;font-weight:500;color:var(--navy);margin:8px 0}
    .sectionHead p{color:var(--muted);max-width:480px;line-height:1.7}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
    .filter{border:1px solid var(--line);background:white;color:#47617b;border-radius:999px;padding:10px 16px;font-weight:600}
    .filter.active,.filter:hover{background:var(--navy);color:white;border-color:var(--navy)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    .card{background:white;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 30px rgba(7,26,53,.05);transition:.25s}
    .card:hover{transform:translateY(-7px);box-shadow:var(--shadow)}
    .watchImg{height:270px;background:linear-gradient(145deg,#effbff,#c7edfb);display:grid;place-items:center;position:relative}
    .miniWatch{width:130px;height:190px;position:relative;filter:drop-shadow(0 15px 12px rgba(7,26,53,.18))}
    .miniStrap{position:absolute;left:43px;width:44px;height:190px;border-radius:24px;background:linear-gradient(90deg,#071a35,#315c87,#071a35)}
    .miniFace{position:absolute;top:45px;left:20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9f8ff,#5cbfe3 40%,#0b315c 75%);border:8px solid #e5eef3}
    .miniHand{position:absolute;left:50%;bottom:50%;width:2px;height:35%;background:white;transform-origin:bottom}
    .cardBody{padding:20px}
    .cardBody h3{margin:0 0 7px;color:var(--navy);font-family:Georgia,serif;font-size:22px}
    .meta{font-size:13px;color:var(--muted);margin-bottom:14px}
    .priceRow{display:flex;justify-content:space-between;align-items:center}
    .price{font-weight:800;color:var(--navy);font-size:17px}
    .add{border:0;background:var(--ice);color:#08769e;border-radius:12px;padding:10px 13px;font-weight:800}
    .add:hover{background:var(--blue);color:var(--navy)}
    .story{background:var(--navy);color:white;max-width:none}
    .storyInner{max-width:1240px;margin:auto;padding:90px 24px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
    .story h2{font-family:Georgia,serif;font-size:54px;font-weight:500;margin:10px 0 20px}
    .story p{color:#bfd0e2;line-height:1.9}
    .quote{border:1px solid #274565;border-radius:28px;padding:34px;background:linear-gradient(145deg,#0d2a50,#071a35)}
    .quote strong{display:block;color:var(--blue);margin-top:20px}
    .contactBox{background:linear-gradient(135deg,#dff7ff,#fff);border:1px solid var(--line);border-radius:32px;padding:42px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
    .contactBox h2{font-family:Georgia,serif;font-size:42px;font-weight:500;color:var(--navy);margin:0 0 10px}
    .contactItem{padding:18px 0;border-bottom:1px solid #cfe5ee}.contactItem:last-child{border:0}
    .contactLabel{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#6790a4}
    .contactValue{font-size:18px;font-weight:700;color:var(--navy);margin-top:5px}
    footer{background:#041327;color:#9fb5ca;padding:34px 24px}
    .footerInner{max-width:1240px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13px}
    .drawerOverlay{position:fixed;inset:0;background:rgba(2,13,27,.48);z-index:50;opacity:0;pointer-events:none;transition:.25s}
    .drawerOverlay.open{opacity:1;pointer-events:auto}
    .drawer{position:absolute;right:0;top:0;height:100%;width:min(440px,100%);background:white;padding:28px;overflow:auto}
    .drawerHead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}
    .drawerHead h2{font-family:Georgia,serif;color:var(--navy);margin:0}
    .close{border:0;background:#eef8fc;border-radius:50%;width:38px;height:38px}
    .cartItem{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
    .cartThumb{width:70px;height:70px;border-radius:15px;background:var(--ice);display:grid;place-items:center}
    .cartThumb:after{content:"◉";font-size:30px;color:var(--navy)}
    .cartInfo{flex:1}.cartInfo strong{color:var(--navy)}.cartInfo small{display:block;color:var(--muted);margin-top:4px}
    .qty{display:flex;gap:8px;align-items:center;margin-top:10px}.qty button{border:1px solid var(--line);background:white;width:28px;height:28px;border-radius:8px}
    .remove{border:0;background:none;color:#8b9bab;font-size:12px}
    .total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;color:var(--navy);padding:24px 0}
    .checkout{width:100%;border:0;border-radius:14px;padding:15px;background:var(--navy);color:white;font-weight:800}
    .empty{text-align:center;color:var(--muted);padding:70px 10px}
    .modalOverlay{position:fixed;inset:0;background:rgba(2,13,27,.58);z-index:60;display:grid;place-items:center;padding:20px}
    .modal{background:white;width:min(520px,100%);border-radius:26px;padding:30px;box-shadow:var(--shadow)}
    .modal h2{font-family:Georgia,serif;color:var(--navy);font-size:34px;margin-top:0}
    .field{margin:12px 0}.field label{font-size:12px;font-weight:800;color:#5c7186;display:block;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
    .field input:focus,.field select:focus{border-color:#68c5e6;box-shadow:0 0 0 3px #e1f7ff}
    .modalActions{display:flex;gap:10px;margin-top:20px}.secondary{flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:13px;font-weight:700}.primary{flex:1;border:0;background:var(--navy);color:white;border-radius:12px;padding:13px;font-weight:700}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:white;padding:13px 18px;border-radius:999px;z-index:100;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.heroInner,.storyInner,.contactBox{grid-template-columns:1fr}.navlinks{display:none}.hero{min-height:auto}.storyInner{gap:35px}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.nav{padding:0 15px}.heroInner{padding:60px 18px}section{padding:65px 18px}.sectionHead{display:block}.sectionHead h2{font-size:38px}.story h2{font-size:42px}.contactBox{padding:26px}.logo{font-size:22px}}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect} = React;

const products = [
  {id:1,name:"Aurelius",category:"Automatic",price:24999,desc:"Swiss-inspired automatic movement",tone:"navy"},
  {id:2,name:"Élan",category:"Dress",price:18999,desc:"Sapphire glass · ultra-slim case",tone:"silver"},
  {id:3,name:"Mariner",category:"Sport",price:15999,desc:"100M water resistance · steel",tone:"blue"},
  {id:4,name:"Noir 01",category:"Automatic",price:32999,desc:"Open-heart automatic movement",tone:"black"},
  {id:5,name:"Regent",category:"Dress",price:21999,desc:"Italian leather · polished steel",tone:"silver"},
  {id:6,name:"Aero",category:"Sport",price:13999,desc:"Chronograph · luminous hands",tone:"navy"},
  {id:7,name:"Imperial",category:"Automatic",price:39999,desc:"Power reserve · exhibition back",tone:"navy"},
  {id:8,name:"Celeste",category:"Dress",price:16999,desc:"Pearl dial · refined bracelet",tone:"blue"}
];

function money(n){return "₹"+n.toLocaleString("en-IN")}
function WatchGraphic({small=false,index=0,product=null}){
  const designs = {
    Aurelius:{case:"#d9e8ef",dial:"#0c315b",strap:"#091a33",accent:"#8ed8f5",style:"classic"},
    Élan:{case:"#f1f4f6",dial:"#f7fbfd",strap:"#7a8b9a",accent:"#7fcbe7",style:"dress"},
    Mariner:{case:"#c7d8e1",dial:"#075b91",strap:"#102d4d",accent:"#8ed8f5",style:"sport"},
    "Noir 01":{case:"#b8c2ca",dial:"#111923",strap:"#05080d",accent:"#8ed8f5",style:"open"},
    Regent:{case:"#d9b56f",dial:"#f5f0df",strap:"#563827",accent:"#b88a35",style:"classic"},
    Aero:{case:"#c9d5dc",dial:"#162c45",strap:"#17212d",accent:"#9be7ff",style:"chrono"},
    Imperial:{case:"#d4b46d",dial:"#0a1b2d",strap:"#0a1625",accent:"#d8bd78",style:"skeleton"},
    Celeste:{case:"#e6edf0",dial:"#eafaff",strap:"#b9d8e4",accent:"#5fb8d7",style:"pearl"}
  };
  const d = product ? designs[product.name] : designs.Aurelius;
  const s = small ? 190 : 360;
  const cx = s/2, cy = small ? 72 : 170, r = small ? 48 : 96;
  const strapW = small ? 34 : 62;
  const handAngle = 28 + index*23;
  const hand2 = 132 + index*11;
  const polar=(angle,len)=>({x:cx+Math.sin(angle*Math.PI/180)*len,y:cy-Math.cos(angle*Math.PI/180)*len});
  const p1=polar(handAngle,r*.58), p2=polar(hand2,r*.43);
  const sub = d.style==="chrono";
  const open = d.style==="open" || d.style==="skeleton";
  return <div style={{width:small?150:430,height:small?270:430,display:"grid",placeItems:"center",filter:"drop-shadow(0 22px 18px rgba(7,26,53,.20))"}}>
    <svg viewBox={`0 0 ${s} ${s+(small?55:100)}`} width="100%" height="100%" aria-label={product ? product.name+" watch" : "KS Watches timepiece"}>
      <defs>
        <linearGradient id={"strap"+index} x1="0" x2="1"><stop offset="0" stopColor={d.strap}/><stop offset=".5" stopColor={d.accent}/><stop offset="1" stopColor={d.strap}/></linearGradient>
        <radialGradient id={"dial"+index} cx=".35" cy=".25"><stop offset="0" stopColor={d.accent}/><stop offset=".32" stopColor={d.dial}/><stop offset="1" stopColor={d.dial}/></radialGradient>
        <linearGradient id={"case"+index} x1="0" x2="1"><stop stopColor="#ffffff"/><stop offset=".35" stopColor={d.case}/><stop offset=".65" stopColor="#8da4b4"/><stop offset="1" stopColor="#ffffff"/></linearGradient>
      </defs>
      <rect x={cx-strapW/2} y="4" width={strapW} height={s+(small?45:80)} rx={strapW/2} fill={"url(#strap"+index+")"}/>
      <rect x={cx-strapW*.38} y="10" width={strapW*.76} height={s+(small?35:65)} rx={strapW*.38} fill={d.strap} opacity=".7"/>
      <circle cx={cx} cy={cy} r={r+ (small?8:16)} fill={"url(#case"+index+")"} stroke="#6f8799" strokeWidth={small?2:4}/>
      <circle cx={cx} cy={cy} r={r*.89} fill={"url(#dial"+index+")"} stroke={d.accent} strokeWidth={small?1.5:3}/>
      <circle cx={cx} cy={cy} r={r*.76} fill="none" stroke="rgba(255,255,255,.45)" strokeWidth="1"/>
      {[0,30,60,90,120,150,180,210,240,270,300,330].map(a=>{
        const q1=polar(a,r*.72),q2=polar(a,r*.82);
        return <line key={a} x1={q1.x} y1={q1.y} x2={q2.x} y2={q2.y} stroke="#fff" strokeWidth={a%90===0?3:1.5} opacity=".9"/>;
      })}
      {(d.style==="dress" || d.style==="pearl") && <text x={cx} y={cy-22} textAnchor="middle" fontSize={small?6:11} fill={d.style==="dress"?"#35556f":"#17617d"} fontFamily="Georgia">KS WATCHES</text>}
      {d.style==="classic" && <text x={cx} y={cy-22} textAnchor="middle" fontSize={small?6:11} fill="#fff" fontFamily="Georgia">KS WATCHES</text>}
      {open && <><circle cx={cx} cy={cy} r={r*.27} fill="none" stroke={d.accent} strokeWidth={small?3:6}/><circle cx={cx- r*.2} cy={cy+r*.1} r={r*.12} fill={d.accent} opacity=".75"/><path d={`M ${cx-r*.48} ${cy+r*.32} Q ${cx} ${cy-r*.5} ${cx+r*.48} ${cy+r*.32}`} fill="none" stroke={d.accent} strokeWidth={small?2:4} opacity=".8"/></>}
      {sub && [0,1,2].map(k=><circle key={k} cx={cx + (k-1)*r*.34} cy={cy+r*.28} r={r*.10} fill="none" stroke="#fff" strokeWidth={small?1:2}/>)}
      <line x1={cx} y1={cy} x2={p1.x} y2={p1.y} stroke="#fff" strokeWidth={small?2.5:5} strokeLinecap="round"/>
      <line x1={cx} y1={cy} x2={p2.x} y2={p2.y} stroke={d.accent} strokeWidth={small?2:4} strokeLinecap="round"/>
      <circle cx={cx} cy={cy} r={small?4:7} fill={d.accent} stroke="#fff" strokeWidth="1.5"/>
    </svg>
  </div>
}
function App(){
  const [category,setCategory]=useState("All");
  const [cart,setCart]=useState(()=>JSON.parse(localStorage.getItem("ks_cart")||"[]"));
  const [cartOpen,setCartOpen]=useState(false);
  const [checkout,setCheckout]=useState(false);
  const [toast,setToast]=useState("");
  const [query,setQuery]=useState("");

  useEffect(()=>localStorage.setItem("ks_cart",JSON.stringify(cart)),[cart]);
  const categories=["All","Automatic","Dress","Sport"];
  const filtered=products.filter(p=>(category==="All"||p.category===category)&&p.name.toLowerCase().includes(query.toLowerCase()));
  const count=cart.reduce((a,b)=>a+b.qty,0);
  const total=cart.reduce((a,b)=>a+b.price*b.qty,0);

  function add(p){
    setCart(c=>{const x=c.find(i=>i.id===p.id); return x?c.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i):[...c,{...p,qty:1}]});
    setToast(p.name+" added to your collection");
    setTimeout(()=>setToast(""),1800);
  }
  function change(id,d){
    setCart(c=>c.map(i=>i.id===id?{...i,qty:i.qty+d}:i).filter(i=>i.qty>0))
  }
  function scrollTo(id){document.getElementById(id)?.scrollIntoView({behavior:"smooth"});}

  return <>
    <div className="topbar">Complimentary insured shipping across India · Lifetime service support</div>
    <header><div className="nav">
      <a className="logo" href="#">KS<span>.</span> WATCHES</a>
      <nav className="navlinks"><a href="#collection">Collection</a><a href="#story">Our Story</a><a href="#contact">Contact</a></nav>
      <div className="actions">
        <button className="iconbtn" aria-label="Search" onClick={()=>scrollTo("collection")}>⌕</button>
        <button className="iconbtn" aria-label="Shopping bag" onClick={()=>setCartOpen(true)}>♢<span className="badge">{count}</span></button>
      </div>
    </div></header>

    <main>
      <section className="hero">
        <div className="heroInner">
          <div>
            <div className="eyebrow">KS Watches · Est. 2026</div>
            <h1>Time,<br/>elevated.</h1>
            <p>Precision-crafted watches for people who appreciate quiet luxury. Designed to be noticed, built to be remembered.</p>
            <a className="cta" href="#collection">Explore the collection <span>→</span></a>
          </div>
          <WatchGraphic product={products[0]}/>
        </div>
      </section>

      <section id="collection">
        <div className="sectionHead">
          <div><div className="eyebrow">The collection</div><h2>Signature timepieces</h2></div>
          <p>From understated dress watches to confident sport pieces, every KS watch is designed around clean proportions and enduring character.</p>
        </div>
        <div style={{display:"flex",gap:12,marginBottom:22,flexWrap:"wrap"}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search watches..." style={{flex:"1 1 220px",padding:"12px 16px",border:"1px solid var(--line)",borderRadius:999,outline:"none"}}/>
        </div>
        <div className="filters">{categories.map(c=><button key={c} className={"filter "+(category===c?"active":"")} onClick={()=>setCategory(c)}>{c}</button>)}</div>
        <div className="grid">
          {filtered.map((p,i)=><article className="card" key={p.id}>
            <div className="watchImg"><WatchGraphic small index={i} product={p}/><span style={{position:"absolute",bottom:12,left:14,padding:"6px 10px",borderRadius:999,background:"rgba(255,255,255,.72)",backdropFilter:"blur(8px)",fontSize:10,fontWeight:800,letterSpacing:".12em",color:"var(--navy)"}}>{p.name.toUpperCase()}</span></div>
            <div className="cardBody"><h3>{p.name}</h3><div className="meta">{p.category} · {p.desc}</div><div className="priceRow"><span className="price">{money(p.price)}</span><button className="add" onClick={()=>add(p)}>Add to bag</button></div></div>
          </article>)}
        </div>
        {filtered.length===0 && <div className="empty">No timepiece matches your search.</div>}
      </section>

      <div className="story" id="story"><div className="storyInner">
        <div><div className="eyebrow">The KS philosophy</div><h2>Luxury is<br/>in the details.</h2><p>KS Watches was created around a simple idea: a premium watch should feel exceptional without needing to shout. Every dial, case, hand and strap is chosen to create a timeless silhouette that works today and years from now.</p></div>
        <div className="quote"><div style={{fontSize:44,color:"#8ed8f5"}}>“</div><div style={{fontFamily:"Georgia,serif",fontSize:25,lineHeight:1.5}}>Wear your time. Make it yours.</div><strong>— Karshil Shah, Founder</strong></div>
      </div></div>

      <section id="contact">
        <div className="contactBox">
          <div><div className="eyebrow">Concierge</div><h2>Let's talk time.</h2><p style={{color:"var(--muted)",lineHeight:1.7}}>For product enquiries, private viewings, gifting or after-sales support, reach out directly to the KS Watches team.</p></div>
          <div>
            <div className="contactItem"><div className="contactLabel">Owner</div><div className="contactValue">Karshil Shah</div></div>
            <div className="contactItem"><div className="contactLabel">Phone</div><div className="contactValue"><a href="tel:+919316355681">+91 93163 55681</a></div></div>
            <div className="contactItem"><div className="contactLabel">Brand</div><div className="contactValue">KS Watches</div></div>
          </div>
        </div>
      </section>
    </main>

    <footer><div className="footerInner"><span>© 2026 KS Watches. All rights reserved.</span><span>Crafted for timeless moments · Karshil Shah</span></div></footer>

    <div className={"drawerOverlay "+(cartOpen?"open":"")} onClick={()=>setCartOpen(false)}>
      <aside className="drawer" onClick={e=>e.stopPropagation()}>
        <div className="drawerHead"><h2>Your collection</h2><button className="close" onClick={()=>setCartOpen(false)}>×</button></div>
        {cart.length===0 ? <div className="empty">Your bag is waiting.<br/>Add a timepiece you love.</div> :
          <>{cart.map(i=><div className="cartItem" key={i.id}><div className="cartThumb"></div><div className="cartInfo"><strong>{i.name}</strong><small>{money(i.price)} · {i.category}</small><div className="qty"><button onClick={()=>change(i.id,-1)}>−</button><b>{i.qty}</b><button onClick={()=>change(i.id,1)}>+</button><button className="remove" onClick={()=>setCart(c=>c.filter(x=>x.id!==i.id))}>Remove</button></div></div></div>)}
          <div className="total"><span>Total</span><span>{money(total)}</span></div>
          <button className="checkout" onClick={()=>setCheckout(true)}>Proceed to checkout</button></>}
      </aside>
    </div>

    {checkout && <div className="modalOverlay"><div className="modal">
      <h2>Secure checkout</h2><p style={{color:"var(--muted)"}}>This demo checkout validates your details locally. Connect a payment gateway/backend before accepting live orders.</p>
      <form onSubmit={e=>{e.preventDefault();setCheckout(false);setCart([]);setCartOpen(false);setToast("Order placed successfully — thank you for choosing KS Watches.");setTimeout(()=>setToast(""),3000)}}>
        <div className="field"><label>FULL NAME</label><input required placeholder="Your name"/></div>
        <div className="field"><label>PHONE</label><input required pattern="[0-9+ -]{10,15}" placeholder="+91"/></div>
        <div className="field"><label>DELIVERY CITY</label><input required placeholder="City"/></div>
        <div className="field"><label>PAYMENT METHOD</label><select><option>Cash on Delivery</option><option>UPI / Card (demo)</option></select></div>
        <div className="modalActions"><button type="button" className="secondary" onClick={()=>setCheckout(false)}>Back</button><button className="primary">Place order</button></div>
      </form>
    </div></div>}
    <div className={"toast "+(toast?"show":"")}>{toast}</div>
  </>
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!--
KS WATCHES — SINGLE-FILE DEPLOYMENT NOTE
This file is intentionally self-contained on the frontend and uses React via CDN.

Node.js cannot literally execute inside the browser alongside HTML/CSS/React as the same runtime.
If you later want a real backend, save the following as server.js and run:
  npm init -y
  npm i express
  node server.js

Minimal backend:
const express = require("express");
const path = require("path");
const app = express();
app.use(express.json());
app.use(express.static(__dirname));
app.post("/api/orders",(req,res)=>res.json({ok:true,orderId:"KS-"+Date.now()}));
app.listen(3000,()=>console.log("KS Watches running on http://localhost:3000"));

For a truly single physical file with a Node server, you can use a .js file containing the HTML string,
