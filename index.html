<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KS Watches — Timeless Luxury</title>
  <meta name="description" content="KS Watches — premium timepieces curated by Karshil Shah." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    :root {
      --navy: #071a35;
      --navy2: #0b2850;
      --blue: #8ed8f5;
      --ice: #eaf9ff;
      --white: #fff;
      --text: #10233d;
      --muted: #6c7b8e;
      --line: #dbeaf3;
      --shadow: 0 24px 60px rgba(7, 26, 53, .13);
      --radius: 22px;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
      --transition: .35s cubic-bezier(.25, .46, .45, .94);
      --gold: #c9a96e;
      --gold-light: #f0e0c0;
    }
    html {
      scroll-behavior: smooth;
    }
    ::selection {
      background: var(--navy);
      color: var(--white);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--ice);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--navy);
      border-radius: 8px;
    }
    body {
      margin: 0;
      font-family: var(--font-sans);
      color: var(--text);
      background: #f8fcff;
      -webkit-font-smoothing: antialiased;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    img {
      display: block;
      max-width: 100%;
    }
    /* ---- top bar ---- */
    .topbar {
      background: var(--navy);
      color: #dff7ff;
      text-align: center;
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .topbar span {
      color: var(--gold);
    }
    /* ---- header ---- */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(219, 234, 243, .7);
    }
    .nav {
      max-width: 1400px;
      margin: auto;
      height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .logo span {
      color: #4baed1;
    }
    .logo small {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: .2em;
      font-family: var(--font-sans);
      margin-left: 6px;
    }
    .navlinks {
      display: flex;
      gap: 28px;
      font-size: 13px;
      font-weight: 600;
      color: #38516d;
    }
    .navlinks a {
      position: relative;
      transition: color var(--transition);
    }
    .navlinks a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--navy);
      transition: width var(--transition);
    }
    .navlinks a:hover::after,
    .navlinks a.active::after {
      width: 100%;
    }
    .navlinks a:hover {
      color: #1685b4;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .iconbtn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 50%;
      color: var(--navy);
      position: relative;
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: all var(--transition);
    }
    .iconbtn:hover {
      border-color: var(--navy);
      background: var(--ice);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(7, 26, 53, .08);
    }
    .badge {
      position: absolute;
      right: -3px;
      top: -3px;
      background: var(--navy);
      color: white;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--navy);
      border-radius: 4px;
      transition: var(--transition);
    }
    /* ---- hero ---- */
    .hero {
      min-height: 720px;
      background: radial-gradient(circle at 80% 35%, #c9f2ff 0, #b7e9fa 22%, transparent 48%), linear-gradient(135deg, #fff 0, #eefaff 52%, #d9f4ff 100%);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23071a35' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .heroInner {
      max-width: 1400px;
      width: 100%;
      padding: 60px 24px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 1;
    }
    .heroContent .eyebrow {
      font-size: 12px;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-weight: 800;
      color: #1685b4;
      display: inline-block;
      padding: 6px 16px;
      border: 1px solid rgba(22, 133, 180, .25);
      border-radius: 999px;
      background: rgba(255, 255, 255, .5);
      backdrop-filter: blur(4px);
    }
    .heroContent h1 {
      font-family: var(--font-serif);
      font-size: clamp(48px, 7vw, 88px);
      line-height: .93;
      margin: 18px 0 10px;
      color: var(--navy);
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    .heroContent h1 em {
      color: #1685b4;
      font-style: normal;
    }
    .heroContent p {
      font-size: 18px;
      line-height: 1.8;
      color: #50657d;
      max-width: 500px;
      font-weight: 400;
    }
    .heroActions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 24px;
      align-items: center;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      border-radius: 999px;
      background: var(--navy);
      color: white;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .02em;
      box-shadow: 0 14px 30px rgba(7, 26, 53, .2);
      transition: all var(--transition);
      border: 1px solid var(--navy);
    }
    .cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 45px rgba(7, 26, 53, .25);
    }
    .cta-outline {
      background: transparent;
      color: var(--navy);
      box-shadow: none;
      border: 1px solid var(--navy);
    }
    .cta-outline:hover {
      background: var(--navy);
      color: white;
    }
    .heroWatch {
      width: min(500px, 85vw);
      aspect-ratio: 1;
      position: relative;
      margin: auto;
      filter: drop-shadow(0 30px 45px rgba(7, 26, 53, .2));
    }
    /* ---- marquee ---- */
    .marquee {
      background: var(--navy);
      color: #dff7ff;
      padding: 12px 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .06em;
      border-top: 1px solid rgba(255, 255, 255, .05);
      border-bottom: 1px solid rgba(255, 255, 255, .05);
    }
    .marqueeInner {
      display: inline-block;
      animation: marquee 35s linear infinite;
    }
    .marqueeInner span {
      margin: 0 40px;
    }
    .marqueeInner span em {
      color: var(--gold);
      font-style: normal;
    }
    @keyframes marquee {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }
    /* ---- section common ---- */
    section {
      max-width: 1400px;
      margin: auto;
      padding: 80px 24px;
    }
    .sectionHead {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .sectionHead h2 {
      font-family: var(--font-serif);
      font-size: 44px;
      font-weight: 500;
      color: var(--navy);
      margin: 6px 0;
      letter-spacing: -0.02em;
    }
    .sectionHead h2 small {
      font-size: 16px;
      font-weight: 400;
      color: var(--muted);
      font-family: var(--font-sans);
      letter-spacing: 0;
      display: block;
    }
    .sectionHead p {
      color: var(--muted);
      max-width: 440px;
      line-height: 1.7;
    }
    .sectionHead .viewAll {
      font-weight: 600;
      color: #1685b4;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
      white-space: nowrap;
    }
    .sectionHead .viewAll:hover {
      border-color: #1685b4;
    }
    /* ---- filters ---- */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .filter {
      border: 1px solid var(--line);
      background: white;
      color: #47617b;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 13px;
      transition: all var(--transition);
    }
    .filter.active,
    .filter:hover {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
      transform: translateY(-2px);
    }
    /* ---- grid ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(7, 26, 53, .04);
      transition: all var(--transition);
      position: relative;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow);
    }
    .card .badge-top {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--navy);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: .06em;
      z-index: 2;
    }
    .card .badge-top.gold {
      background: var(--gold);
      color: var(--navy);
    }
    .card .wishlist-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .6);
      display: grid;
      place-items: center;
      font-size: 16px;
      color: var(--muted);
      transition: all var(--transition);
    }
    .card .wishlist-btn:hover {
      background: white;
      color: #e74c6f;
      transform: scale(1.08);
    }
    .card .wishlist-btn.active {
      color: #e74c6f;
    }
    .watchImg {
      height: 280px;
      background: linear-gradient(145deg, #effbff, #c7edfb);
      display: grid;
      place-items: center;
      position: relative;
    }
    .watchImg .watch-graphic {
      width: 140px;
      height: 200px;
      position: relative;
      filter: drop-shadow(0 18px 18px rgba(7, 26, 53, .15));
      transition: transform var(--transition);
    }
    .card:hover .watchImg .watch-graphic {
      transform: scale(1.04);
    }
    .cardBody {
      padding: 20px 22px 24px;
    }
    .cardBody .cat-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      font-weight: 600;
    }
    .cardBody h3 {
      margin: 4px 0 6px;
      color: var(--navy);
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 500;
    }
    .cardBody .rating {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .cardBody .rating .stars {
      color: #f5b342;
      letter-spacing: 1px;
    }
    .priceRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .price {
      font-weight: 700;
      color: var(--navy);
      font-size: 18px;
    }
    .price .orig {
      font-weight: 400;
      color: var(--muted);
      font-size: 14px;
      text-decoration: line-through;
      margin-left: 8px;
    }
    .add {
      border: 0;
      background: var(--ice);
      color: #08769e;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13px;
      transition: all var(--transition);
    }
    .add:hover {
      background: var(--blue);
      color: var(--navy);
      transform: scale(1.02);
    }
    /* ---- product detail page ---- */
    .product-detail {
      padding: 40px 24px 80px;
      max-width: 1400px;
      margin: auto;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }
    .detail-gallery {
      position: relative;
    }
    .detail-gallery .main-img {
      background: linear-gradient(145deg, #effbff, #c7edfb);
      border-radius: var(--radius);
      padding: 40px;
      display: grid;
      place-items: center;
      min-height: 480px;
      border: 1px solid var(--line);
      position: relative;
    }
    .detail-gallery .main-img .watch-graphic {
      width: 260px;
      height: 380px;
      filter: drop-shadow(0 30px 40px rgba(7, 26, 53, .18));
    }
    .detail-gallery .thumbnails {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .detail-gallery .thumbnails button {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: white;
      transition: var(--transition);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .detail-gallery .thumbnails button.active {
      border-color: var(--navy);
    }
    .detail-gallery .thumbnails button .watch-graphic {
      width: 48px;
      height: 68px;
      transform: scale(.7);
    }
    .detail-info .breadcrumb {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .detail-info .breadcrumb span {
      color: var(--navy);
    }
    .detail-info h1 {
      font-family: var(--font-serif);
      font-size: 44px;
      font-weight: 500;
      color: var(--navy);
      margin: 6px 0 4px;
    }
    .detail-info .subtitle {
      color: var(--muted);
      font-size: 16px;
    }
    .detail-info .price-large {
      font-size: 32px;
      font-weight: 700;
      color: var(--navy);
      margin: 14px 0 6px;
    }
    .detail-info .price-large .orig {
      font-size: 20px;
      color: var(--muted);
      text-decoration: line-through;
      font-weight: 400;
      margin-left: 12px;
    }
    .detail-info .rating-large {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--muted);
    }
    .detail-info .rating-large .stars {
      color: #f5b342;
    }
    .detail-options {
      margin: 22px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .detail-options label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }
    .detail-options .opt-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .detail-options .opt-btn {
      padding: 6px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      transition: all var(--transition);
      background: white;
    }
    .detail-options .opt-btn.active {
      border-color: var(--navy);
      background: var(--navy);
      color: white;
    }
    .detail-options .opt-btn:hover:not(.active) {
      border-color: var(--navy);
    }
    .detail-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .detail-actions .cta {
      padding: 14px 36px;
    }
    .detail-tabs {
      margin-top: 30px;
      border-top: 1px solid var(--line);
    }
    .detail-tabs .tab-headers {
      display: flex;
      gap: 24px;
      padding-top: 16px;
    }
    .detail-tabs .tab-headers button {
      padding: 8px 0;
      font-weight: 600;
      font-size: 14px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: var(--transition);
    }
    .detail-tabs .tab-headers button.active {
      color: var(--navy);
      border-color: var(--navy);
    }
    .detail-tabs .tab-content {
      padding: 20px 0;
      line-height: 1.8;
      color: #38516d;
    }
    .detail-tabs .tab-content ul {
      padding-left: 20px;
    }
    .detail-tabs .tab-content ul li {
      margin: 6px 0;
    }
    /* ---- cart page ---- */
    .cart-page {
      padding: 40px 24px 80px;
      max-width: 1400px;
      margin: auto;
    }
    .cart-page h1 {
      font-family: var(--font-serif);
      font-size: 48px;
      font-weight: 500;
      color: var(--navy);
      margin: 0 0 8px;
    }
    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 40px;
      margin-top: 24px;
    }
    .cart-items {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
    }
    .cart-item {
      display: flex;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .cart-item:last-child {
      border: 0;
    }
    .cart-item .thumb {
      width: 80px;
      height: 100px;
      background: linear-gradient(145deg, #effbff, #c7edfb);
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .cart-item .thumb .watch-graphic {
      width: 56px;
      height: 80px;
      transform: scale(.6);
    }
    .cart-item .info {
      flex: 1;
    }
    .cart-item .info h4 {
      font-family: var(--font-serif);
      font-size: 18px;
      margin: 0 0 2px;
      color: var(--navy);
    }
    .cart-item .info .meta {
      font-size: 13px;
      color: var(--muted);
    }
    .cart-item .info .qty {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
    }
    .cart-item .info .qty button {
      width: 28px;
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-weight: 700;
      background: white;
      transition: var(--transition);
    }
    .cart-item .info .qty button:hover {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }
    .cart-item .info .qty span {
      font-weight: 700;
      min-width: 24px;
      text-align: center;
    }
    .cart-item .item-price {
      font-weight: 700;
      font-size: 18px;
      color: var(--navy);
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .cart-item .item-price .remove {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      transition: var(--transition);
    }
    .cart-item .item-price .remove:hover {
      color: #c0392b;
    }
    .cart-summary {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
      position: sticky;
      top: 100px;
      height: fit-content;
    }
    .cart-summary h3 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 500;
      margin: 0 0 16px;
      color: var(--navy);
    }

    function ToastContainer({ toasts }) {

    function Header({ cartCount, wishlistCount, onNavigate, currentRoute, onCartOpen, onWishlistOpen }) {
      const [menuOpen, setMenuOpen] = useState(false);
      return (
        <header>
          <div className="nav">
            <div className="logo" style={{ cursor: 'pointer' }} onClick={() => onNavigate('home')}>
              KS <span>Watches</span> <small>— since 2022</small>
            </div>
            <div className="navlinks">
              {['Home', 'Collection', 'Stories', 'Concierge'].map((label, i) => (
                <a key={i} href="#" onClick={(e) => { e.preventDefault(); if (label === 'Home') onNavigate('home'); else onNavigate('home'); }} className={currentRoute.page === 'home' && label === 'Home' ? 'active' : ''}>{label}</a>
              ))}
            </div>
            <div className="actions">
              <button className="iconbtn" onClick={() => onNavigate('wishlist')} title="Wishlist">
                ♡ {wishlistCount > 0 && <span className="badge">{wishlistCount}</span>}
              </button>
              <button className="iconbtn" onClick={onCartOpen} title="Cart">

              </button>
              <button className="hamburger" onClick={() => setMenuOpen(!menuOpen)}>
                <span /><span /><span />
              </button>
            </div>
          </div>
        </header>
      );
    }

    function HeroSection({ onNavigate }) {
      useEffect(() => {
        const els = document.querySelectorAll('.fade-up');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: .15 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
      return (
        <section className="hero" style={{ padding: '0' }}>
          <div className="heroInner">
            <div className="heroContent">
              <div className="eyebrow fade-up">✦ Haute Horlogerie</div>
              <h1 className="fade-up">Time <em>redefined</em> <br />for the bold.</h1>
              <p className="fade-up">Discover the art of fine watchmaking with KS Watches — where tradition meets innovation, and every second tells a story.</p>
              <div className="heroActions fade-up">
                <button className="cta" onClick={() => onNavigate('home')}>Explore Collection →</button>
                <button className="cta cta-outline" onClick={() => onNavigate('home')}>Book a Viewing</button>
              </div>
            </div>
            <div className="heroWatch fade-up">
              <WatchGraphic design="classic" color="navy" size="large" />
            </div>
          </div>
        </section>
      );
    }

    function MarqueeStrip() {
      return (
        <div className="marquee">
          <div className="marqueeInner">
            <span>✦ SWISS-INSPIRED MOVEMENTS</span>
            <span>✦ <em>FREE SHIPPING</em> ON ORDERS OVER ₹2,00,000</span>
            <span>✦ COMPLIMENTARY GIFT WRAPPING</span>

            <span>✦ EXCLUSIVE <em>LIMITED EDITIONS</em></span>

            <span>✦ <em>FREE SHIPPING</em> ON ORDERS OVER ₹2,00,000</span>
            <span>✦ COMPLIMENTARY GIFT WRAPPING</span>
            <span>✦ 5-YEAR <em>WARRANTY</em></span>
            <span>✦ EXCLUSIVE <em>LIMITED EDITIONS</em></span>
          </div>
        </div>
      );
    }

    function CollectionSection({ products, category, setCategory, onProductClick, onAddToCart, onWishlistToggle, wishlist }) {
      const filtered = category === 'All' ? products : products.filter(p => p.category === category);

      useEffect(() => {
        const els = document.querySelectorAll('.fade-up');
        const obs = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: .1 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, [category]);

      return (
        <section id="collection">
          <div className="sectionHead fade-up">
            <div>
              <h2>Our Collection <small>Curated for the discerning</small></h2>
            </div>
            <a href="#" className="viewAll" onClick={(e) => e.preventDefault()}>View all →</a>
          </div>
          <div className="filters fade-up">
            {CATEGORIES.map(c => (
              <button key={c} className={`filter ${c === category ? 'active' : ''}`} onClick={() => setCategory(c)}>
                {c}
              </button>
            ))}
          </div>
          <div className="grid">
            {filtered.map((p, i) => (
              <ProductCard
                key={p.id}
                product={p}
                index={i}
                onClick={() => onProductClick(p.id)}
                onAdd={() => onAddToCart(p)}
                onWishlist={() => onWishlistToggle(p.id)}
                isWishlisted={wishlist.includes(p.id)}
              />
            ))}
          </div>
          {filtered.length === 0 && (
            <div className="empty-state">
              <h3>No watches found</h3>
              <p>Try selecting a different category</p>
            </div>
          )}
        </section>
      );
    }

    function ProductCard({ product, onClick, onAdd, onWishlist, isWishlisted, index }) {
      return (
        <div className="card fade-up" style={{ transitionDelay: `${(index % 4) * 60}ms` }}>

          <button className={`wishlist-btn ${isWishlisted ? 'active' : ''}`} onClick={(e) => { e.stopPropagation(); onWishlist(); }}>{isWishlisted ? '♥' : '♡'}</button>
          <div className="watchImg" onClick={onClick}>
            <WatchGraphic design={product.design || 'classic'} color={product.tone || 'navy'} />
          </div>
          <div className="cardBody" onClick={onClick}>

    // ---------- App ----------
    function App() {
      const [route, setRoute] = useState({ page: 'home', id: null });
      const [category, setCategory] = useState('All');
      const [cart, setCart] = useState(() => {
        try { return JSON.parse(localStorage.getItem('ks_cart')) || []; } catch { return []; }
      });
      const [wishlist, setWishlist] = useState(() => {
        try { return JSON.parse(localStorage.getItem('ks_wishlist')) || []; } catch { return []; }
      });
      const [toasts, setToasts] = useState([]);
      const [checkoutOpen, setCheckoutOpen] = useState(false);

      useEffect(() => {
        const handleHash = () => {
          const hash = window.location.hash.slice(1) || '/';
          if (hash === '/') setRoute({ page: 'home', id: null });
          else if (hash.startsWith('/product/')) {
            const id = parseInt(hash.split('/')[2]);
            if (!isNaN(id)) setRoute({ page: 'product', id });
          } else if (hash === '/cart') setRoute({ page: 'cart', id: null });
          else if (hash === '/checkout') setRoute({ page: 'checkout', id: null });
          else if (hash === '/wishlist') setRoute({ page: 'wishlist', id: null });
          else setRoute({ page: 'home', id: null });
        };
        window.addEventListener('hashchange', handleHash);
        handleHash();
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      useEffect(() => {
        localStorage.setItem('ks_cart', JSON.stringify(cart));
        if (cart.length > 0) {
          const ids = cart.map(i => i.id);
          const recent = JSON.parse(localStorage.getItem('ks_recent') || '[]');
          const updated = [...new Set([...ids, ...recent])].slice(0, 8);
          localStorage.setItem('ks_recent', JSON.stringify(updated));
        }
      }, [cart]);

      useEffect(() => {
        localStorage.setItem('ks_wishlist', JSON.stringify(wishlist));
      }, [wishlist]);

      const navigate = (page, id = null) => {
        if (page === 'home') window.location.hash = '/';
        else if (page === 'product' && id) window.location.hash = `/product/${id}`;
        else if (page === 'cart') window.location.hash = '/cart';
        else if (page === 'checkout') window.location.hash = '/checkout';
        else if (page === 'wishlist') window.location.hash = '/wishlist';
        else window.location.hash = '/';
        setRoute({ page, id });
      };

      const addToast = (message, type = 'info', icon = '✦') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type, icon }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      const addToCart = (product) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === product.id);
          if (existing) return prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
          return [...prev, { ...product, qty: 1 }];
        });
        addToast(`${product.name} added to cart`, 'success', '✓');
      };

      const updateQty = (id, qty) => {
        if (qty <= 0) { setCart(prev => prev.filter(i => i.id !== id)); return; }
        setCart(prev => prev.map(i => i.id === id ? { ...i, qty } : i));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(i => i.id !== id));
        addToast('Item removed from cart', 'info');
      };

      const toggleWishlist = (id) => {
        setWishlist(prev => {
          if (prev.includes(id)) { addToast('Removed from wishlist', 'info'); return prev.filter(i => i !== id); }
          addToast('Added to wishlist ♥', 'success', '♥');
          return [...prev, id];
        });
      };

      const cartCount = cart.reduce((s, i) => s + i.qty, 0);
      const wishlistCount = wishlist.length;

      const currentProduct = route.page === 'product' ? PRODUCTS.find(p => p.id === route.id) : null;
      const related = currentProduct ? PRODUCTS.filter(p => p.id !== currentProduct.id && p.category === currentProduct.category).slice(0, 3) : [];

      const renderContent = () => {
        if (route.page === 'product' && currentProduct) {
          return (
            <ProductDetail
              product={currentProduct}
              onNavigate={navigate}
              onAddToCart={addToCart}
              onWishlistToggle={toggleWishlist}
              wishlist={wishlist}
              related={related}
            />
          );
        }
        if (route.page === 'cart') {
          return (
            <CartPage
              cart={cart}
              onUpdateQty={updateQty}
              onRemove={removeFromCart}
              onNavigate={navigate}
              onCheckout={() => navigate('checkout')}
            />
          );
        }
        if (route.page === 'checkout') {
          return (
            <CheckoutPage
              cart={cart}
              onNavigate={navigate}
              onComplete={() => { setCart([]); addToast('Order placed! Thank you.', 'success', '🎉'); }}
            />
          );
        }
        if (route.page === 'wishlist') {
          const items = PRODUCTS.filter(p => wishlist.includes(p.id));
          return (
            <section>
              <div className="sectionHead"><h2>Your Wishlist <small>{items.length} items</small></h2></div>
              {items.length === 0 ? (
                <div className="empty-state"><h3>Your wishlist is empty</h3><button className="cta" onClick={() => navigate('home')}>Explore Collection</button></div>
              ) : (
                <div className="grid">
                  {items.map(p => (
                    <ProductCard
                      key={p.id}
                      product={p}
                      onClick={() => navigate('product', p.id)}
                      onAdd={() => addToCart(p)}
                      onWishlist={() => toggleWishlist(p.id)}
                      isWishlisted={true}
                      index={0}
                    />
                  ))}
                </div>
              )}
            </section>
          );
        }
        return (
          <>
            <HeroSection onNavigate={navigate} />
            <MarqueeStrip />
            <CollectionSection
              products={PRODUCTS}
              category={category}
              setCategory={setCategory}
              onProductClick={(id) => navigate('product', id)}
              onAddToCart={addToCart}
              onWishlistToggle={toggleWishlist}
              wishlist={wishlist}
            />
            <StorySection />
            <TestimonialsSection />
            <ContactSection />
          </>
        );
      };

      return (
        <div className="app">
          <TopBar />
          <Header
            cartCount={cartCount}
            wishlistCount={wishlistCount}
            onNavigate={navigate}
            currentRoute={route}
            onCartOpen={() => navigate('cart')}
          />
          {renderContent()}
          <Footer />
          <ToastContainer toasts={toasts} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
